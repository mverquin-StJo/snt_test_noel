<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- À MODIFIER : Mettre le prénom dans l'onglet -->
  <title>Vœux de Noël • [PRÉNOM]</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    /* --- FOND HIVERNAL & FLOCONS --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at top, #1b3b48 0%, #09151e 100%);
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    .flocon {
      position: fixed;
      top: -10px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 1em;
      user-select: none;
      pointer-events: none;
      animation: chute linear infinite;
      z-index: 0;
    }

    @keyframes chute {
      0% { transform: translateY(-10vh) rotate(0deg); }
      100% { transform: translateY(110vh) rotate(360deg); }
    }

    /* --- CARTE EN VERRE DÉPOLI --- */
    .carte {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-top: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 28px;
      padding: 30px 25px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    /* --- BADGE DU LYCÉE --- */
    .badge-lycee {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.3);
      padding: 8px 16px;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      margin-bottom: 20px;
    }

    .logo-lycee {
      height: 36px;
      width: 36px;
      object-fit: contain;
      background: white;
      border-radius: 50%;
      padding: 3px;
    }

    .infos-lycee {
      text-align: left;
      line-height: 1.2;
    }

    .nom-lycee {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: #f8c291;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .classe-lycee {
      font-size: 0.7rem;
      color: #d1d8e0;
    }

    /* --- TITRE ET MESSAGE --- */
    h1 {
      font-family: 'Mountains of Christmas', cursive;
      font-size: 2.6rem;
      color: #ffd32a;
      text-shadow: 0 2px 10px rgba(255, 211, 42, 0.4);
      margin-bottom: 8px;
      line-height: 1.1;
    }

    .prenom-eleve {
      display: inline-block;
      background: linear-gradient(90deg, #ff5e57, #ffdd59);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }

    .message {
      font-size: 0.92rem;
      font-weight: 300;
      color: #f1f2f6;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    /* --- SAPIN & ÉTOILE ÉTINCELANTE --- */
    .zone-sapin {
      position: relative;
      margin: 10px auto;
      cursor: pointer;
    }

    svg {
      width: 240px;
      height: auto;
      overflow: visible;
    }

    .boule {
      transition: fill 0.4s ease, filter 0.4s ease;
    }

    /* Animation douce par défaut de l'étoile */
    .etoile-groupe {
      transform-origin: 110px 25px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .etoile-forme {
      transform-origin: 110px 25px;
      animation: scintillementDoux 2s infinite alternate;
    }

    @keyframes scintillementDoux {
      from { transform: scale(1); filter: drop-shadow(0 0 5px #ffd32a); }
      to { transform: scale(1.1); filter: drop-shadow(0 0 12px #ffffff); }
    }

    /* Mode Étincelant Intense (activé par le bouton) */
    .rayons-etoile {
      transform-origin: 110px 25px;
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    .mode-etincelant .rayons-etoile {
      opacity: 1;
      animation: rotationRayons 6s linear infinite;
    }

    .mode-etincelant .etoile-forme {
      animation: flashIntense 0.45s infinite alternate;
    }

    @keyframes rotationRayons {
      from { transform: rotate(0deg) scale(0.95); }
      50% { transform: rotate(180deg) scale(1.15); }
      to { transform: rotate(360deg) scale(0.95); }
    }

    @keyframes flashIntense {
      from { 
        fill: #ffd32a; 
        transform: scale(1.05); 
        filter: drop-shadow(0 0 12px #ffd32a) drop-shadow(0 0 25px #ff9f1a); 
      }
      to { 
        fill: #ffffff; 
        transform: scale(1.28); 
        filter: drop-shadow(0 0 18px #ffffff) drop-shadow(0 0 35px #ffd32a); 
      }
    }

    /* Étincelles qui jaillissent autour de l'étoile */
    .etincelle {
      opacity: 0;
      transform-origin: center;
    }

    .mode-etincelant .etincelle-1 { animation: popEtincelle 1.1s infinite 0.1s; }
    .mode-etincelant .etincelle-2 { animation: popEtincelle 1.3s infinite 0.4s; }
    .mode-etincelant .etincelle-3 { animation: popEtincelle 0.9s infinite 0.7s; }
    .mode-etincelant .etincelle-4 { animation: popEtincelle 1.2s infinite 0.2s; }

    @keyframes popEtincelle {
      0% { opacity: 0; transform: scale(0); }
      50% { opacity: 1; transform: scale(1.3); }
      100% { opacity: 0; transform: scale(0); }
    }

    /* --- BOUTONS D'ACTION --- */
    .actions {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    button {
      background: linear-gradient(135deg, #e55039, #eb2f06);
      color: white;
      border: none;
      padding: 10px 16px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(235, 47, 6, 0.4);
      transition: all 0.25s ease;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button.btn-secondaire {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: none;
    }

    button.btn-secondaire.actif {
      background: linear-gradient(135deg, #20bf6b, #0fb9b1);
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(32, 191, 107, 0.4);
    }

    button.btn-etoile.actif {
      background: linear-gradient(135deg, #f7b731, #fa8231);
      color: #1e272e;
      font-weight: 700;
      border-color: transparent;
      box-shadow: 0 4px 15px rgba(247, 183, 49, 0.5);
    }

    /* --- PIED DE PAGE --- */
    footer {
      margin-top: 22px;
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div id="neige-container"></div>

  <div class="carte">
    
    <!-- 1. IDENTITÉ DU LYCÉE -->
    <div class="badge-lycee">
      <!-- À MODIFIER : Mettre "logo.png" si le logo est à la racine du dépôt -->
      <img src="https://via.placeholder.com/100x100.png?text=LOGO" alt="Logo Lycée" class="logo-lycee">
      <div class="infos-lycee">
        <span class="nom-lycee">Lycée Saint-Joseph</span>
        <span class="classe-lycee">Classe de Seconde GT • SNT</span>
      </div>
    </div>

    <!-- 2. VŒUX PERSONNALISÉS -->
    <h1>Joyeux Noël !</h1>
    <!-- À MODIFIER : Prénom et message de l'élève -->
    <p class="message">
      <span class="prenom-eleve">[PRÉNOM]</span> vous souhaite de merveilleuses fêtes de fin d'année, pleines de magie et de bonheur !
    </p>

    <!-- 3. SAPIN VECTORIEL DÉTAILLÉ -->
    <div class="zone-sapin">
      <svg viewBox="0 0 220 260">
        <defs>
          <linearGradient id="vertFonce" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2ecc71" />
            <stop offset="100%" stop-color="#145a32" />
          </linearGradient>
          <linearGradient id="vertClair" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#58d68d" />
            <stop offset="100%" stop-color="#1e8449" />
          </linearGradient>
          <radialGradient id="haloEtoile" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
            <stop offset="40%" stop-color="#ffd32a" stop-opacity="0.5" />
            <stop offset="100%" stop-color="#ffd32a" stop-opacity="0" />
          </radialGradient>
        </defs>

        <!-- Ombre au sol -->
        <ellipse cx="110" cy="238" rx="75" ry="12" fill="rgba(0,0,0,0.4)" />

        <!-- Tronc -->
        <rect x="96" y="200" width="28" height="36" rx="4" fill="#4e342e" />

        <!-- Cadeaux au pied du sapin -->
        <rect x="52" y="212" width="26" height="24" rx="3" fill="#e74c3c" />
        <rect x="63" y="212" width="4" height="24" fill="#f1c40f" />
        <rect x="142" y="216" width="22" height="20" rx="3" fill="#3498db" />
        <rect x="151" y="216" width="4" height="20" fill="#ffffff" />

        <!-- Branches du sapin (clic pour changer les boules) -->
        <g onclick="changerLumieres()">
          <path d="M110 110 L30 205 Q110 218 190 205 Z" fill="url(#vertFonce)" />
          <path d="M110 65 L45 150 Q110 162 175 150 Z" fill="url(#vertClair)" />
          <path d="M110 25 L60 98 Q110 108 160 98 Z" fill="url(#vertFonce)" />

          <!-- Guirlande dorée -->
          <path d="M72 82 Q110 98 148 82" fill="none" stroke="#ffd32a" stroke-width="2.5" stroke-dasharray="4,3" opacity="0.8" />
          <path d="M55 135 Q110 155 165 135" fill="none" stroke="#ffd32a" stroke-width="2.5" stroke-dasharray="4,3" opacity="0.8" />
          <path d="M40 190 Q110 212 180 190" fill="none" stroke="#ffd32a" stroke-width="2.5" stroke-dasharray="4,3" opacity="0.8" />

          <!-- Boules de Noël -->
          <circle class="boule" cx="92" cy="75" r="6.5" fill="#ff3f34" />
          <circle class="boule" cx="128" cy="78" r="6.5" fill="#0fbcf9" />
          <circle class="boule" cx="75" cy="128" r="7.5" fill="#ffd32a" />
          <circle class="boule" cx="112" cy="122" r="7.5" fill="#ff5e57" />
          <circle class="boule" cx="145" cy="130" r="7.5" fill="#05c46b" />
          <circle class="boule" cx="62" cy="182" r="8.5" fill="#0fbcf9" />
          <circle class="boule" cx="98" cy="178" r="8.5" fill="#ffa801" />
          <circle class="boule" cx="132" cy="184" r="8.5" fill="#ef5777" />
          <circle class="boule" cx="162" cy="178" r="8.5" fill="#ffd32a" />
        </g>

        <!-- ÉTOILE ET EFFET ÉTINCELANT (clic direct possible sur l'étoile) -->
        <g id="groupeEtoile" class="etoile-groupe" onclick="toggleEtoileEtincelante()">
          <!-- Halo et rayons rotatifs -->
          <g class="rayons-etoile">
            <circle cx="110" cy="25" r="42" fill="url(#haloEtoile)" />
            <line x1="110" y1="-15" x2="110" y2="65" stroke="#ffffff" stroke-width="1.5" opacity="0.7" />
            <line x1="70" y1="25" x2="150" y2="25" stroke="#ffffff" stroke-width="1.5" opacity="0.7" />
            <line x1="82" y1="-3" x2="138" y2="53" stroke="#ffd32a" stroke-width="1.2" opacity="0.6" />
            <line x1="138" y1="-3" x2="82" y2="53" stroke="#ffd32a" stroke-width="1.2" opacity="0.6" />
          </g>

          <!-- Étoile principale -->
          <polygon class="etoile-forme" points="110,5 115,19 130,19 118,28 122,42 110,33 98,42 102,28 90,19 105,19" fill="#ffd32a" />

          <!-- Petites étincelles satellites -->
          <circle class="etincelle etincelle-1" cx="82" cy="8" r="2.2" fill="#ffffff" />
          <circle class="etincelle etincelle-2" cx="140" cy="10" r="2.5" fill="#ffd32a" />
          <circle class="etincelle etincelle-3" cx="85" cy="42" r="2" fill="#ffd32a" />
          <circle class="etincelle etincelle-4" cx="136" cy="40" r="2.2" fill="#ffffff" />
        </g>
      </svg>
    </div>

    <!-- 4. BOUTONS INTERACTIFS -->
    <div class="actions">
      <button onclick="changerLumieres()">✨ Boules</button>
      <button id="btnAuto" class="btn-secondaire" onclick="toggleClignotement()">🔄 Guirlande auto</button>
      <button id="btnEtoile" class="btn-secondaire btn-etoile" onclick="toggleEtoileEtincelante()">⭐ Étoile étincelante</button>
    </div>

    <footer>
      Carte numérique créée en SNT • Décembre 2026
    </footer>
  </div>

  <script>
    const couleursNeon = ["#ff3f34", "#0fbcf9", "#ffd32a", "#05c46b", "#ff5e57", "#d2dae2", "#be2edd"];
    let intervalleClignotement = null;
    let etoileActive = false;

    // Changer la couleur des boules
    function changerLumieres() {
      const boules = document.querySelectorAll('.boule');
      boules.forEach(boule => {
        const couleur = couleursNeon[Math.floor(Math.random() * couleursNeon.length)];
        boule.setAttribute('fill', couleur);
        boule.style.filter = `drop-shadow(0 0 8px ${couleur})`;
      });
    }

    // Mode clignotement automatique des boules
    function toggleClignotement() {
      const bouton = document.getElementById('btnAuto');
      if (intervalleClignotement) {
        clearInterval(intervalleClignotement);
        intervalleClignotement = null;
        bouton.classList.remove('actif');
        bouton.textContent = "🔄 Guirlande auto";
      } else {
        changerLumieres();
        intervalleClignotement = setInterval(changerLumieres, 600);
        bouton.classList.add('actif');
        bouton.textContent = "⏸️ Stopper";
      }
    }

    // Mode étincelant pour l'étoile
    function toggleEtoileEtincelante() {
      const groupeEtoile = document.getElementById('groupeEtoile');
      const boutonEtoile = document.getElementById('btnEtoile');
      
      etoileActive = !etoileActive;
      
      if (etoileActive) {
        groupeEtoile.classList.add('mode-etincelant');
        boutonEtoile.classList.add('actif');
        boutonEtoile.textContent = "🌟 Étoile activée";
      } else {
        groupeEtoile.classList.remove('mode-etincelant');
        boutonEtoile.classList.remove('actif');
        boutonEtoile.textContent = "⭐ Étoile étincelante";
      }
    }

    // Génération des flocons de neige
    function creerNeige() {
      const container = document.getElementById('neige-container');
      for (let i = 0; i < 25; i++) {
        const flocon = document.createElement('div');
        flocon.className = 'flocon';
        flocon.textContent = '❄';
        flocon.style.left = Math.random() * 100 + 'vw';
        flocon.style.animationDuration = (Math.random() * 5 + 5) + 's';
        flocon.style.animationDelay = Math.random() * 5 + 's';
        flocon.style.fontSize = (Math.random() * 12 + 10) + 'px';
        container.appendChild(flocon);
      }
    }

    // Initialisation
    creerNeige();
    changerLumieres();
  </script>

</body>
</html>
