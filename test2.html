<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- ÉTAPE 1 : Mettre le prénom de l'élève -->
  <title>Vœux de Noël • [PRÉNOM]</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    /* =====================================================================
       1. PALETTE DE COULEURS (À PERSONNALISER PAR L'ÉLÈVE EN CSS)
       ===================================================================== */
    :root {
      --fond-haut: #162e38;
      --fond-bas: #071117;
      --couleur-titre: #ffd32a;
      
      /* Couleurs des boules 3D du sapin */
      --boule-1: #e55039; /* Rouge */
      --boule-2: #f6b93b; /* Or */
      --boule-3: #1e90ff; /* Bleu */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at top, var(--fond-haut) 0%, var(--fond-bas) 100%);
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }

    /* Flocons de neige */
    .flocon {
      position: fixed;
      top: -15px;
      color: rgba(255, 255, 255, 0.85);
      pointer-events: none;
      animation: chute linear infinite;
      z-index: 10;
      text-shadow: 0 0 4px rgba(255, 255, 255, 0.5);
    }
    @keyframes chute {
      from { transform: translateY(-10vh) rotate(0deg); }
      to { transform: translateY(110vh) rotate(360deg); }
    }

    /* Carte principale */
    .carte {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 28px;
      padding: 24px 16px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.65);
    }

    h1 {
      font-family: 'Mountains of Christmas', cursive;
      font-size: 2.5rem;
      color: var(--couleur-titre);
      text-shadow: 0 2px 12px rgba(255, 211, 42, 0.35);
      line-height: 1.1;
      margin-bottom: 10px;
    }

    .message {
      font-size: 0.9rem;
      font-weight: 300;
      color: #f1f2f6;
      line-height: 1.45;
      margin-bottom: 22px;
      padding: 0 10px;
      word-wrap: break-word;
    }

    /* --- SCÈNE DU SAPIN + TRAIN EN ORBITE 3D --- */
    .scene-container {
      position: relative;
      width: 280px;
      height: 325px;
      margin: 0 auto;
    }

    .sapin-svg {
      position: relative;
      z-index: 2;
      width: 260px;
      height: auto;
      cursor: pointer;
      overflow: visible;
      filter: drop-shadow(0 15px 20px rgba(0,0,0,0.5));
    }

    /* Voie ferrée ovale au pied du sapin */
    .rails {
      position: absolute;
      bottom: 14px;
      left: 10px;
      width: 260px;
      height: 54px;
      border: 3px dashed rgba(255, 211, 42, 0.45);
      border-radius: 50%;
      z-index: 1;
      pointer-events: none;
    }

    /* Wagons du train */
    .wagon {
      position: absolute;
      bottom: 24px;
      left: 50%;
      font-size: 26px;
      user-select: none;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    /* Boules 3D */
    .boule-3d {
      transition: filter 0.3s ease;
    }
    .boules-allumees .boule-3d {
      filter: drop-shadow(0 0 8px #ffffff) brightness(1.3);
    }

    /* --- GRAND HALO LUMINEUX & LOGO SAINT-JOSEPH --- */
    .halo-lumiere {
      transform-origin: 130px 18px;
      opacity: 0.48;
      pointer-events: none;
      transition: opacity 0.5s ease, transform 0.5s ease;
      animation: respirerHalo 3.5s ease-in-out infinite alternate;
    }

    @keyframes respirerHalo {
      from { transform: scale(0.95); opacity: 0.4; }
      to { transform: scale(1.08); opacity: 0.6; }
    }

    .mode-etincelant .halo-lumiere {
      opacity: 0.95;
      animation: rayonnerFort 1.4s ease-in-out infinite alternate;
    }

    @keyframes rayonnerFort {
      from { transform: scale(1.05); opacity: 0.8; }
      to { transform: scale(1.25); opacity: 1; }
    }

    .etoile-groupe { cursor: pointer; }
    
    /* Animation douce au repos */
    .etoile-logo {
      transform-origin: 130px 20px;
      animation: scintillerDoux 2.5s ease-in-out infinite alternate;
    }
    @keyframes scintillerDoux {
      from { transform: scale(1); filter: drop-shadow(0 0 6px rgba(255, 211, 42, 0.6)); }
      to { transform: scale(1.05); filter: drop-shadow(0 0 16px #ffd32a); }
    }

    /* Animation active : brille et change de couleurs */
    .mode-etincelant .etoile-logo {
      animation: brillerCouleurs 2.2s linear infinite;
    }
    @keyframes brillerCouleurs {
      0%   { transform: scale(1.05); filter: hue-rotate(0deg) brightness(1.2) drop-shadow(0 0 15px #ffd32a); }
      33%  { transform: scale(1.14); filter: hue-rotate(110deg) brightness(1.35) drop-shadow(0 0 24px #00f2fe); }
      66%  { transform: scale(1.08); filter: hue-rotate(240deg) brightness(1.35) drop-shadow(0 0 24px #ff758c); }
      100% { transform: scale(1.05); filter: hue-rotate(360deg) brightness(1.2) drop-shadow(0 0 15px #ffd32a); }
    }

    /* Boutons */
    .boutons {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    button {
      background: linear-gradient(135deg, #e55039, #c23616);
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 50px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover { transform: translateY(-2px); }
    button.btn-secondaire {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }
    button.actif {
      background: linear-gradient(135deg, #f7b731, #fa8231);
      color: #1e272e;
      font-weight: 700;
      border: none;
    }

    footer {
      margin-top: 18px;
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.6);
    }
  </style>
</head>
<body>

  <div id="neige"></div>

  <div class="carte">
    
    <!-- 1. VŒUX PERSONNALISÉS -->
    <h1>Joyeux Noël !</h1>
    <p class="message">
      <strong>[PRÉNOM]</strong> vous souhaite de merveilleuses fêtes de fin d'année !
    </p>

    <!-- 2. SCÈNE : SAPIN RÉALISTE + LOGO D'ORIGINE + TRAIN 3D -->
    <div class="scene-container" id="scene">
      
      <div class="rails"></div>

      <svg id="sapin" class="sapin-svg" viewBox="0 0 260 310">
        <defs>
          <linearGradient id="brancheBas" x1="0%" y1="0%" x2="100%" y2="80%">
            <stop offset="0%" stop-color="#1e6b43" />
            <stop offset="50%" stop-color="#11472b" />
            <stop offset="100%" stop-color="#082918" />
          </linearGradient>
          <linearGradient id="brancheMilieu" x1="0%" y1="0%" x2="100%" y2="80%">
            <stop offset="0%" stop-color="#278554" />
            <stop offset="55%" stop-color="#155735" />
            <stop offset="100%" stop-color="#0b3620" />
          </linearGradient>
          <linearGradient id="brancheHaut" x1="0%" y1="0%" x2="100%" y2="80%">
            <stop offset="0%" stop-color="#32a86b" />
            <stop offset="60%" stop-color="#1c6e43" />
            <stop offset="100%" stop-color="#0e4227" />
          </linearGradient>
          <radialGradient id="reflet3D" cx="35%" cy="30%" r="65%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
            <stop offset="30%" stop-color="#ffffff" stop-opacity="0.15" />
            <stop offset="100%" stop-color="#000000" stop-opacity="0.45" />
          </radialGradient>
          <linearGradient id="troncBois" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#5d4037" />
            <stop offset="100%" stop-color="#2e1d18" />
          </linearGradient>

          <!-- HALO RADIAL DOUX ET CHALEUREUX QUI RAYONNE SUR LE SAPIN -->
          <radialGradient id="haloEtoile" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
            <stop offset="22%" stop-color="#ffd32a" stop-opacity="0.55" />
            <stop offset="55%" stop-color="#f6b93b" stop-opacity="0.22" />
            <stop offset="100%" stop-color="#ffd32a" stop-opacity="0" />
          </radialGradient>
        </defs>

        <!-- Ombre portée au sol -->
        <ellipse cx="130" cy="288" rx="80" ry="11" fill="rgba(0,0,0,0.5)" />
        <!-- Tronc -->
        <rect x="115" y="248" width="30" height="40" rx="4" fill="url(#troncBois)" />

        <!-- Branches du sapin (clic = allumer les boules) -->
        <g onclick="toggleBoules()">
          <path d="M130 175 L28 256 Q75 270 130 258 Q185 270 232 256 Z" fill="url(#brancheBas)" />
          <path d="M130 125 L42 206 Q85 220 130 208 Q175 220 218 206 Z" fill="url(#brancheMilieu)" />
          <path d="M130 80 L60 154 Q95 166 130 156 Q165 166 200 154 Z" fill="url(#brancheHaut)" />
          <path d="M130 48 L78 106 Q105 116 130 108 Q155 116 182 106 Z" fill="url(#brancheHaut)" />

          <!-- Guirlande dorée -->
          <path d="M88 95 Q135 112 175 98" fill="none" stroke="#ffd32a" stroke-width="2" stroke-dasharray="3,4" opacity="0.85" />
          <path d="M65 148 Q130 172 195 150" fill="none" stroke="#ffd32a" stroke-width="2.5" stroke-dasharray="3,4" opacity="0.85" />
          <path d="M48 200 Q130 228 212 202" fill="none" stroke="#ffd32a" stroke-width="2.5" stroke-dasharray="3,4" opacity="0.85" />
          <path d="M38 248 Q130 274 222 248" fill="none" stroke="#ffd32a" stroke-width="3" stroke-dasharray="3,4" opacity="0.85" />

          <!-- Boules 3D -->
          <g class="boule-3d"><circle cx="108" cy="90" r="8" fill="var(--boule-1)" /><circle cx="108" cy="90" r="8" fill="url(#reflet3D)" /></g>
          <g class="boule-3d"><circle cx="152" cy="94" r="8" fill="var(--boule-2)" /><circle cx="152" cy="94" r="8" fill="url(#reflet3D)" /></g>
          
          <g class="boule-3d"><circle cx="88" cy="142" r="9.5" fill="var(--boule-3)" /><circle cx="88" cy="142" r="9.5" fill="url(#reflet3D)" /></g>
          <g class="boule-3d"><circle cx="132" cy="138" r="9.5" fill="var(--boule-1)" /><circle cx="132" cy="138" r="9.5" fill="url(#reflet3D)" /></g>
          <g class="boule-3d"><circle cx="172" cy="146" r="9.5" fill="var(--boule-2)" /><circle cx="172" cy="146" r="9.5" fill="url(#reflet3D)" /></g>

          <g class="boule-3d"><circle cx="74" cy="194" r="11" fill="var(--boule-2)" /><circle cx="74" cy="194" r="11" fill="url(#reflet3D)" /></g>
          <g class="boule-3d"><circle cx="115" cy="190" r="11" fill="var(--boule-3)" /><circle cx="115" cy="190" r="11" fill="url(#reflet3D)" /></g>
          <g class="boule-3d"><circle cx="155" cy="196" r="11" fill="var(--boule-1)" /><circle cx="155" cy="196" r="11" fill="url(#reflet3D)" /></g>
          <g class="boule-3d"><circle cx="190" cy="192" r="10" fill="var(--boule-3)" /><circle cx="190" cy="192" r="10" fill="url(#reflet3D)" /></g>

          <g class="boule-3d"><circle cx="62" cy="242" r="12" fill="var(--boule-1)" /><circle cx="62" cy="242" r="12" fill="url(#reflet3D)" /></g>
          <g class="boule-3d"><circle cx="105" cy="246" r="12" fill="var(--boule-2)" /><circle cx="105" cy="246" r="12" fill="url(#reflet3D)" /></g>
          <g class="boule-3d"><circle cx="152" cy="244" r="12" fill="var(--boule-3)" /><circle cx="152" cy="244" r="12" fill="url(#reflet3D)" /></g>
          <g class="boule-3d"><circle cx="198" cy="240" r="12" fill="var(--boule-2)" /><circle cx="198" cy="240" r="12" fill="url(#reflet3D)" /></g>
        </g>

        <!-- LOGO D'ORIGINE + GRAND HALO LUMINEUX -->
        <g id="groupe-etoile" class="etoile-groupe" onclick="activerEtoile()">
          <!-- Grand halo doux qui rayonne largement sur le sapin -->
          <circle class="halo-lumiere" cx="130" cy="18" r="140" fill="url(#haloEtoile)" />
          
          <!-- Vérifie sur GitHub si ton nouveau fichier détouré finit par .png ou .jpg -->
          <g class="etoile-logo">
            <image 
              href="https://mverquin-stjo.github.io/snt_test_noel/LOGO_SaintJOSEPH.jpg" 
              x="82" y="-12" width="96" height="62" 
              preserveAspectRatio="xMidYMid meet" />
          </g>
        </g>
      </svg>

    </div>

    <!-- 3. BOUTONS INTERACTIFS -->
    <div class="boutons">
      <button onclick="toggleBoules()">✨ Boules</button>
      <button id="btn-etoile" class="btn-secondaire" onclick="activerEtoile()">⭐ Étoile</button>
      <button id="btn-train" class="btn-secondaire actif" onclick="toggleTrain()">🚂 Train en marche</button>
    </div>

    <!-- 4. SIGNATURE UNIQUE EN BAS -->
    <footer>Projet SNT • Lycée Saint-Joseph Hazebrouck • 2GT</footer>
  </div>

  <script>
    /* =====================================================================
       2. PERSONNALISATION DU TRAIN THÉMATIQUE (À MODIFIER PAR L'ÉLÈVE)
       Exemples :
       - Père Noël : ["🚂", "🎅", "🧸", "🎁", "🦌"]
       - Super Mario : ["🏎️", "🍄", "⭐", "🪙", "🐢"]
       - Harry Potter : ["🚂", "⚡", "🦉", "🪄", "🧹"]
       - Donkey Kong : ["🛒", "🦍", "🍌", "🛢️", "🌴"]
       ===================================================================== */
    const convoiTrain = ["🚂", "🎅", "🧸", "🎁", "🦌"];
    
    let vitesseTrain = 0.025; 
    let trainEnMarche = true;
    let angleTrain = 0;

    const scene = document.getElementById('scene');
    const elementsWagons = [];

    convoiTrain.forEach((symbole) => {
      const div = document.createElement('div');
      div.className = 'wagon';
      div.textContent = symbole;
      scene.appendChild(div);
      elementsWagons.push(div);
    });

    function animerTrain() {
      if (trainEnMarche) {
        angleTrain += vitesseTrain;
      }

      elementsWagons.forEach((wagon, index) => {
        const angleWagon = angleTrain - (index * 0.32);
        const rayonX = 122;
        const rayonY = 22;
        
        const x = Math.cos(angleWagon) * rayonX;
        const y = Math.sin(angleWagon) * rayonY;

        wagon.style.transform = `translate(calc(-50% + ${x}px), ${y}px)`;

        if (Math.sin(angleWagon) > 0) {
          wagon.style.zIndex = 3;
          wagon.style.opacity = 1;
          wagon.style.fontSize = "28px";
        } else {
          wagon.style.zIndex = 1;
          wagon.style.opacity = 0.55;
          wagon.style.fontSize = "21px";
        }
      });

      requestAnimationFrame(animerTrain);
    }

    function toggleTrain() {
      const bouton = document.getElementById('btn-train');
      trainEnMarche = !trainEnMarche;
      bouton.classList.toggle('actif', trainEnMarche);
      bouton.textContent = trainEnMarche ? "🚂 Train en marche" : "⏸️ Train arrêté";
    }

    function toggleBoules() {
      document.getElementById('sapin').classList.toggle('boules-allumees');
    }

    let etoileActive = false;
    function activerEtoile() {
      const groupeEtoile = document.getElementById('groupe-etoile');
      const bouton = document.getElementById('btn-etoile');
      etoileActive = !etoileActive;
      groupeEtoile.classList.toggle('mode-etincelant', etoileActive);
      bouton.classList.toggle('actif', etoileActive);
    }

    function lancerNeige() {
      const zoneNeige = document.getElementById('neige');
      for (let i = 0; i < 30; i++) {
        const flocon = document.createElement('div');
        flocon.className = 'flocon';
        flocon.textContent = '❄';
        flocon.style.left = Math.random() * 100 + 'vw';
        flocon.style.animationDuration = (Math.random() * 5 + 5) + 's';
        flocon.style.animationDelay = Math.random() * 5 + 's';
        flocon.style.fontSize = (Math.random() * 12 + 12) + 'px';
        zoneNeige.appendChild(flocon);
      }
    }

    lancerNeige();
    animerTrain();
  </script>
</body>
</html>
