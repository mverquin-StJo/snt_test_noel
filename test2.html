<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- ÉTAPE 1 : Mettre le prénom de l'élève -->
  <title>Vœux de Noël • [PRÉNOM]</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    /* =====================================================================
       1. PALETTE DE COULEURS (À PERSONNALISER PAR L'ÉLÈVE EN CSS)
       ===================================================================== */
    :root {
      --fond-haut: #162e38;
      --fond-bas: #071117;
      --couleur-titre: #ffd32a;
      
      /* Couleurs des boules 3D du sapin */
      --boule-1: #e55039; /* Rouge */
      --boule-2: #f6b93b; /* Or */
      --boule-3: #1e90ff; /* Bleu */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at top, var(--fond-haut) 0%, var(--fond-bas) 100%);
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Flocons */
    .flocon {
      position: fixed;
      top: -10px;
      color: rgba(255, 255, 255, 0.65);
      pointer-events: none;
      animation: chute linear infinite;
      z-index: 0;
    }
    @keyframes chute {
      from { transform: translateY(-10vh) rotate(0deg); }
      to { transform: translateY(110vh) rotate(360deg); }
    }

    /* Carte principale */
    .carte {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 28px;
      padding: 26px 20px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.65);
    }

    /* Badge du Lycée */
    .badge-lycee {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.35);
      padding: 6px 16px;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      margin-bottom: 14px;
    }

    .logo-lycee {
      height: 36px;
      width: 36px;
      background: white;
      border-radius: 50%;
      padding: 3px;
      object-fit: contain;
    }

    .nom-lycee {
      font-size: 0.78rem;
      font-weight: 700;
      color: #f8c291;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    h1 {
      font-family: 'Mountains of Christmas', cursive;
      font-size: 2.6rem;
      color: var(--couleur-titre);
      text-shadow: 0 2px 12px rgba(255, 211, 42, 0.35);
      line-height: 1.1;
      margin-bottom: 6px;
    }

    .message {
      font-size: 0.92rem;
      font-weight: 300;
      color: #f1f2f6;
      line-height: 1.45;
      margin-bottom: 10px;
    }

    /* --- SCÈNE DU SAPIN + TRAIN EN ORBITE 3D --- */
    .scene-container {
      position: relative;
      width: 280px;
      height: 310px;
      margin: 0 auto;
    }

    /* Le sapin est au plan z-index: 2 */
    .sapin-svg {
      position: relative;
      z-index: 2;
      width: 260px;
      height: auto;
      cursor: pointer;
      overflow: visible;
      filter: drop-shadow(0 15px 20px rgba(0,0,0,0.5));
    }

    /* Voie ferrée ovale au pied du sapin */
    .rails {
      position: absolute;
      bottom: 14px;
      left: 10px;
      width: 260px;
      height: 54px;
      border: 3px dashed rgba(255, 211, 42, 0.45);
      border-radius: 50%;
      z-index: 1;
      pointer-events: none;
    }

    /* Wagons du train qui tournent autour du sapin */
    .wagon {
      position: absolute;
      bottom: 24px;
      left: 50%;
      font-size: 26px;
      user-select: none;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    /* Boules 3D */
    .boule-3d {
      transition: filter 0.3s ease;
    }
    .boules-allumees .boule-3d {
      filter: drop-shadow(0 0 8px #ffffff) brightness(1.3);
    }

    /* Étoile étincelante */
    .etoile-groupe { cursor: pointer; }
    .etoile {
      transform-origin: 130px 26px;
      animation: scintillerDoux 2s infinite alternate;
    }
    @keyframes scintillerDoux {
      from { transform: scale(1); filter: drop-shadow(0 0 6px #ffd32a); }
      to { transform: scale(1.1); filter: drop-shadow(0 0 14px #ffffff); }
    }

    .rayons {
      transform-origin: 130px 26px;
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
    }
    .mode-etincelant .rayons {
      opacity: 1;
      animation: tourner 5s linear infinite;
    }
    .mode-etincelant .etoile {
      animation: flashRapide 0.4s infinite alternate;
    }
    @keyframes flashRapide {
      from { fill: #ffd32a; transform: scale(1.05); filter: drop-shadow(0 0 12px #ffd32a); }
      to { fill: #ffffff; transform: scale(1.28); filter: drop-shadow(0 0 28px #ffffff); }
    }
    @keyframes tourner { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* Boutons */
    .boutons {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    button {
      background: linear-gradient(135deg, #e55039, #c23616);
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 50px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover { transform: translateY(-2px); }
    button.btn-secondaire {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }
    button.actif {
      background: linear-gradient(135deg, #f7b731, #fa8231);
      color: #1e272e;
      font-weight: 700;
      border: none;
    }

    footer {
      margin-top: 18px;
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body>

  <div id="neige"></div>

  <div class="carte">
    
    <!-- 1. IDENTITÉ DU LYCÉE -->
    <div class="badge-lycee">
      <img src="https://lycee-saintjoseph.eu/wp-content/uploads/2025/05/LOGO_SaintJOSEPH.jpg" alt="Logo Lycée" class="logo-lycee">
      <span class="nom-lycee">Lycée Saint-Joseph • 2GT</span>
    </div>

    <!-- 2. VŒUX PERSONNALISÉS -->
    <h1>Joyeux Noël !</h1>
    <p class="message">
      <strong>[PRÉNOM]</strong> vous souhaite de merveilleuses fêtes de fin d'année !
    </p>

    <!-- 3. SCÈNE : SAPIN RÉALISTE + TRAIN AUTOUR DU SAPIN -->
    <div class="scene-container" id="scene">
      
      <!-- Voie ferrée ovale -->
      <div class="rails"></div>

      <!-- Sapin réaliste -->
      <svg id="sapin" class="sapin-svg" viewBox="0 0 260 300">
        <defs>
          <linearGradient id="brancheBas" x1="0%" y1="0%" x2="100%" y2="80%">
            <stop offset="0%" stop-color="#1e6b43" />
            <stop offset="50%" stop-color="#11472b" />
            <stop offset="100%" stop-color="#082918" />
          </linearGradient>
          <linearGradient id="brancheMilieu" x1="0%" y1="0%" x2="100%" y2="80%">
            <stop offset="0%" stop-color="#278554" />
            <stop offset="55%" stop-color="#155735" />
            <stop offset="100%" stop-color="#0b3620" />
          </linearGradient>
          <linearGradient id="brancheHaut" x1="0%" y1="0%" x2="100%" y2="80%">
            <stop offset="0%" stop-color="#32a86b" />
            <stop offset="60%" stop-color="#1c6e43" />
            <stop offset="100%" stop-color="#0e4227" />
          </linearGradient>
          <radialGradient id="reflet3D" cx="35%" cy="30%" r="65%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
            <stop offset="30%" stop-color="#ffffff" stop-opacity="0.15" />
            <stop offset="100%" stop-color="#000000" stop-opacity="0.45" />
          </radialGradient>
          <linearGradient id="troncBois" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#5d4037" />
            <stop offset="100%" stop-color="#2e1d18" />
          </linearGradient>
        </defs>

        <!-- Ombre au sol -->
        <ellipse cx="130" cy="278" rx="80" ry="11" fill="rgba(0,0,0,0.5)" />
        <!-- Tronc -->
        <rect x="115" y="238" width="30" height="40" rx="4" fill="url(#troncBois)" />

        <!-- Branches du sapin (clic = allumer les boules) -->
        <g onclick="toggleBoules()">
          <path d="M130 165 L28 246 Q75 260 130 248 Q185 260 232 246 Z" fill="url(#brancheBas)" />
          <path d="M130 115 L42 196 Q85 210 130 198 Q175 210 218 196 Z" fill="url(#brancheMilieu)" />
          <path d="M130 70 L60 144 Q95 156 130 146 Q165 156 200 144 Z" fill="url(#brancheHaut)" />
          <path d="M130 30 L78 96 Q105 106 130 98 Q155 106 182 96 Z" fill="url(#brancheHaut)" />

          <!-- Guirlande dorée -->
          <path d="M88 85 Q135 102 175 88" fill="none" stroke="#ffd32a" stroke-width="2" stroke-dasharray="3,4" opacity="0.85" />
          <path d="M65 138 Q130 162 195 140" fill="none" stroke="#ffd32a" stroke-width="2.5" stroke-dasharray="3,4" opacity="0.85" />
          <path d="M48 190 Q130 218 212 192" fill="none" stroke="#ffd32a" stroke-width="2.5" stroke-dasharray="3,4" opacity="0.85" />
          <path d="M38 238 Q130 264 222 238" fill="none" stroke="#ffd32a" stroke-width="3" stroke-dasharray="3,4" opacity="0.85" />

          <!-- Boules 3D pures et élégantes -->
          <g class="boule-3d"><circle cx="108" cy="80" r="8" fill="var(--boule-1)" /><circle cx="108" cy="80" r="8" fill="url(#reflet3D)" /></g>
          <g class="boule-3d"><circle cx="152" cy="84" r="8" fill="var(--boule-2)" /><circle cx="152" cy="84" r="8" fill="url(#reflet3D)" /></g>
          
          <g class="boule-3d"><circle cx="88" cy="132" r="9.5" fill="var(--boule-3)" /><circle cx="88" cy="132" r="9.5" fill="url(#reflet3D)" /></g>
          <g class="boule-3d"><circle cx="132" cy="128" r="9.5" fill="var(--boule-1)" /><circle cx="132" cy="128" r="9.5" fill="url(#reflet3D)" /></g>
          <g class="boule-3d"><circle cx="172" cy="136" r="9.5" fill="var(--boule-2)" /><circle cx="172" cy="136" r="9.5" fill="url(#reflet3D)" /></g>

          <g class="boule-3d"><circle cx="74" cy="184" r="11" fill="var(--boule-2)" /><circle cx="74" cy="184" r="11" fill="url(#reflet3D)" /></g>
          <g class="boule-3d"><circle cx="115" cy="180" r="11" fill="var(--boule-3)" /><circle cx="115" cy="180" r="11" fill="url(#reflet3D)" /></g>
          <g class="boule-3d"><circle cx="155" cy="186" r="11" fill="var(--boule-1)" /><circle cx="155" cy="186" r="11" fill="url(#reflet3D)" /></g>
          <g class="boule-3d"><circle cx="190" cy="182" r="10" fill="var(--boule-3)" /><circle cx="190" cy="182" r="10" fill="url(#reflet3D)" /></g>

          <g class="boule-3d"><circle cx="62" cy="232" r="12" fill="var(--boule-1)" /><circle cx="62" cy="232" r="12" fill="url(#reflet3D)" /></g>
          <g class="boule-3d"><circle cx="105" cy="236" r="12" fill="var(--boule-2)" /><circle cx="105" cy="236" r="12" fill="url(#reflet3D)" /></g>
          <g class="boule-3d"><circle cx="152" cy="234" r="12" fill="var(--boule-3)" /><circle cx="152" cy="234" r="12" fill="url(#reflet3D)" /></g>
          <g class="boule-3d"><circle cx="198" cy="230" r="12" fill="var(--boule-2)" /><circle cx="198" cy="230" r="12" fill="url(#reflet3D)" /></g>
        </g>

        <!-- ÉTOILE ÉTINCELANTE -->
        <g id="groupe-etoile" class="etoile-groupe" onclick="activerEtoile()">
          <g class="rayons">
            <line x1="130" y1="-12" x2="130" y2="64" stroke="#ffffff" stroke-width="2" />
            <line x1="92" y1="26" x2="168" y2="26" stroke="#ffffff" stroke-width="2" />
            <line x1="103" y1="-1" x2="157" y2="53" stroke="#ffd32a" stroke-width="1.5" />
            <line x1="157" y1="-1" x2="103" y2="53" stroke="#ffd32a" stroke-width="1.5" />
          </g>
          <polygon class="etoile" points="130,4 136,19 152,19 139,29 144,44 130,35 116,44 121,29 108,19 124,19" fill="#ffd32a" />
        </g>
      </svg>

      <!-- Le JavaScript va insérer ici les wagons du train thématique -->
    </div>

    <!-- 4. BOUTONS INTERACTIFS -->
    <div class="boutons">
      <button onclick="toggleBoules()">✨ Boules</button>
      <button id="btn-etoile" class="btn-secondaire" onclick="activerEtoile()">⭐ Étoile</button>
      <button id="btn-train" class="btn-secondaire actif" onclick="toggleTrain()">🚂 Train en marche</button>
    </div>

    <footer>Projet SNT • Lycée Saint-Joseph</footer>
  </div>

  <script>
    /* =====================================================================
       2. PERSONNALISATION DU TRAIN THÉMATIQUE (À MODIFIER PAR L'ÉLÈVE)
       L'élève choisit son thème et modifie les éléments du convoi !
       Exemples :
       - Père Noël : ["🦌", "🛷", "🎅", "🎁", "🧸"]
       - Super Mario : ["🏎️", "🍄", "⭐", "🪙", "🐢"]
       - Harry Potter : ["🚂", "⚡", "🦉", "🪄", "🧹"]
       - Donkey Kong : ["🛒", "🦍", "🍌", "🛢️", "🌴"]
       ===================================================================== */
    const convoiTrain = ["🚂", "🎅", "🧸", "🎁", "🦌"];
    
    // Vitesse du train (plus le chiffre est grand, plus il va vite)
    let vitesseTrain = 0.025; 
    let trainEnMarche = true;
    let angleTrain = 0;

    // Création des wagons sur la scène
    const scene = document.getElementById('scene');
    const elementsWagons = [];

    convoiTrain.forEach((symbole) => {
      const div = document.createElement('div');
      div.className = 'wagon';
      div.textContent = symbole;
      scene.appendChild(div);
      elementsWagons.push(div);
    });

    // Animation 3D en orbite autour du pied du sapin
    function animerTrain() {
      if (trainEnMarche) {
        angleTrain += vitesseTrain;
      }

      elementsWagons.forEach((wagon, index) => {
        // Décalage entre chaque wagon du convoi (le wagon 0 est en tête)
        const angleWagon = angleTrain - (index * 0.32);
        
        // Coordonnées de l'ellipse autour du sapin
        const rayonX = 122; // Largeur du circuit
        const rayonY = 22;  // Profondeur 3D du circuit
        
        const x = Math.cos(angleWagon) * rayonX;
        const y = Math.sin(angleWagon) * rayonY;

        // Positionnement
        wagon.style.transform = `translate(calc(-50% + ${x}px), ${y}px)`;

        // Gestion de la profondeur 3D : devant le sapin (sin > 0) ou derrière (sin < 0)
        if (Math.sin(angleWagon) > 0) {
          wagon.style.zIndex = 3; // Passe DEVANT le tronc du sapin
          wagon.style.opacity = 1;
          wagon.style.fontSize = "28px";
        } else {
          wagon.style.zIndex = 1; // Passe DERRIÈRE le sapin
          wagon.style.opacity = 0.55;
          wagon.style.fontSize = "21px";
        }
      });

      requestAnimationFrame(animerTrain);
    }

    // Bouton Démarrer / Arrêter le train
    function toggleTrain() {
      const bouton = document.getElementById('btn-train');
      trainEnMarche = !trainEnMarche;
      bouton.classList.toggle('actif', trainEnMarche);
      bouton.textContent = trainEnMarche ? "🚂 Train en marche" : "⏸️ Train arrêté";
    }

    // Allumer / Éteindre les boules 3D
    function toggleBoules() {
      document.getElementById('sapin').classList.toggle('boules-allumees');
    }

    // Activer l'étoile étincelante
    let etoileActive = false;
    function activerEtoile() {
      const groupeEtoile = document.getElementById('groupe-etoile');
      const bouton = document.getElementById('btn-etoile');
      etoileActive = !etoileActive;
      groupeEtoile.classList.toggle('mode-etincelant', etoileActive);
      bouton.classList.toggle('actif', etoileActive);
    }

    // Flocons de neige
    function lancerNeige() {
      const zoneNeige = document.getElementById('neige');
      for (let i = 0; i < 25; i++) {
        const flocon = document.createElement('div');
        flocon.className = 'flocon';
        flocon.textContent = '❄';
        flocon.style.left = Math.random() * 100 + 'vw';
        flocon.style.animationDuration = (Math.random() * 5 + 5) + 's';
        flocon.style.fontSize = (Math.random() * 12 + 10) + 'px';
        zoneNeige.appendChild(flocon);
      }
    }

    // Lancement
    lancerNeige();
    animerTrain();
  </script>
</body>
</html>
